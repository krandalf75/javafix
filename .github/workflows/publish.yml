name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Check tag matches Maven version
        shell: bash
        run: |
          project_version="$(mvn --batch-mode --no-transfer-progress -q help:evaluate \
            -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag v${tag_version} does not match Maven version ${project_version}" >&2
            exit 1
          fi
      - name: Verify and publish
        run: mvn --batch-mode --no-transfer-progress clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare skill installer release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/javafix-${version}.jar" "dist/javafix-${version}.jar"
          cp "target/javafix-${version}.jar" dist/javafix.jar
          tar -czf dist/javafix-skill.tar.gz -C .opencode/skills javafix
          (
            cd dist
            sha256sum "javafix-${version}.jar" javafix.jar javafix-skill.tar.gz > SHA256SUMS
          )
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/javafix-${GITHUB_REF_NAME#v}.jar" \
            dist/javafix.jar \
            dist/javafix-skill.tar.gz \
            dist/SHA256SUMS \
            --title "JavaFix $GITHUB_REF_NAME" \
            --generate-notes
